<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบหารค่าอาหาร</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="text-center">
      <h1 class="text-3xl font-bold text-slate-800">ระบบหารค่าอาหาร</h1>
      <p class="text-slate-500 mt-1">คำนวณแยกรายบุคคลแบบแฟร์ๆ</p>
    </header>

    <!-- 1. จัดการรายชื่อ -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-700 mb-4">1. เพิ่มรายชื่อผู้ร่วมหาร</h2>
      <div class="flex gap-2">
        <input type="text" id="personName" placeholder="ระบุชื่อ..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="addPerson()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">เพิ่มคน</button>
      </div>
      <div id="peopleList" class="flex flex-wrap gap-2 mt-4"></div>
    </section>

    <!-- 2. เพิ่มรายการอาหาร -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-700 mb-4">2. เพิ่มรายการอาหาร</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        <input type="text" id="foodName" placeholder="ชื่อเมนู" class="border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="number" id="foodPrice" placeholder="ราคา (บาท)" class="border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="addFoodItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-medium transition">บันทึกเมนู</button>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-600 mb-2">เลือกว่าใครกินเมนูนี้บ้าง:</label>
        <div id="personCheckboxes" class="flex flex-wrap gap-4 text-slate-700">
          <span class="text-slate-400 text-sm">กรุณาเพิ่มรายชื่อก่อน</span>
        </div>
      </div>

      <!-- ตารางรายการอาหาร -->
      <div class="overflow-x-auto mt-6">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500 text-sm">
              <th class="py-2">เมนู</th>
              <th class="py-2">ราคา</th>
              <th class="py-2">คนร่วมหาร</th>
              <th class="py-2 text-right">จัดการ</th>
            </tr>
          </thead>
          <tbody id="foodTableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. ส่วนลด / Vat / Service Charge -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-700 mb-4">3. ค่าบริการเพิ่มเติม / ส่วนลด</h2>
      
      <div class="space-y-4">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="enableServiceCharge" onchange="calculateTotal()" class="w-4 h-4 text-blue-600 rounded">
          <label for="enableServiceCharge" class="text-slate-700 font-medium">Service Charge 10%</label>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="enableVat" onchange="calculateTotal()" class="w-4 h-4 text-blue-600 rounded">
          <label for="enableVat" class="text-slate-700 font-medium">VAT 7%</label>
        </div>

        <div class="pt-2">
          <label for="discount" class="block text-sm font-medium text-slate-600 mb-1">ส่วนลดท้ายบิล (Optional - บาท)</label>
          <input type="number" id="discount" value="0" min="0" oninput="calculateTotal()" class="w-full md:w-1/3 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
    </section>

    <!-- 4. สรุปผลการคำนวณ -->
    <section class="bg-slate-800 text-white p-6 rounded-xl shadow-sm">
      <h2 class="text-xl font-bold mb-4">4. สรุปยอดเงินที่ต้องจ่าย</h2>
      
      <div id="summaryList" class="space-y-2 divide-y divide-slate-700 mb-6"></div>

      <div class="border-t border-slate-700 pt-4 flex justify-between items-center text-lg font-bold">
        <span>ยอดรวมทั้งสิ้น:</span>
        <span id="grandTotal" class="text-emerald-400 text-2xl">0.00 บาท</span>
      </div>
    </section>

  </div>

  <script>
    let people = [];
    let foodItems = [];

    function addPerson() {
      const input = document.getElementById('personName');
      const name = input.value.trim();
      if (name && !people.includes(name)) {
        people.push(name);
        input.value = '';
        renderPeople();
        renderCheckboxes();
      }
    }

    function removePerson(index) {
      const removedName = people[index];
      people.splice(index, 1);
      
      // ลบคนที่ถูกตัดออกออกจากรายการอาหารด้วย
      foodItems.forEach(item => {
        item.sharedBy = item.sharedBy.filter(name => name !== removedName);
      });

      renderPeople();
      renderCheckboxes();
      renderFoodTable();
      calculateTotal();
    }

    function renderPeople() {
      const container = document.getElementById('peopleList');
      container.innerHTML = people.map((p, i) => `
        <span class="bg-slate-200 text-slate-800 px-3 py-1 rounded-full text-sm flex items-center gap-2">
          ${p}
          <button onclick="removePerson(${i})" class="text-slate-500 hover:text-red-500 font-bold">&times;</button>
        </span>
      `).join('');
    }

    function renderCheckboxes() {
      const container = document.getElementById('personCheckboxes');
      if (people.length === 0) {
        container.innerHTML = '<span class="text-slate-400 text-sm">กรุณาเพิ่มรายชื่อก่อน</span>';
        return;
      }
      container.innerHTML = people.map((p, i) => `
        <label class="inline-flex items-center gap-1 cursor-pointer">
          <input type="checkbox" value="${p}" class="food-share-checkbox w-4 h-4 text-blue-600 rounded">
          <span>${p}</span>
        </label>
      `).join('');
    }

    function addFoodItem() {
      const nameInput = document.getElementById('foodName');
      const priceInput = document.getElementById('foodPrice');
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      const checkboxes = document.querySelectorAll('.food-share-checkbox:checked');
      const sharedBy = Array.from(checkboxes).map(cb => cb.value);

      if (!name || isNaN(price) || price <= 0) {
        alert('กรุณากรอกชื่อเมนูและราคาให้ถูกต้อง');
        return;
      }
      if (sharedBy.length === 0) {
        alert('กรุณาเลือกอย่างน้อย 1 คนเพื่อร่วมหาร');
        return;
      }

      foodItems.push({ name, price, sharedBy });
      
      // ล้างค่าฟอร์ม
      nameInput.value = '';
      priceInput.value = '';
      document.querySelectorAll('.food-share-checkbox').forEach(cb => cb.checked = false);

      renderFoodTable();
      calculateTotal();
    }

    function removeFoodItem(index) {
      foodItems.splice(index, 1);
      renderFoodTable();
      calculateTotal();
    }

    function renderFoodTable() {
      const tbody = document.getElementById('foodTableBody');
      tbody.innerHTML = foodItems.map((item, i) => `
        <tr>
          <td class="py-2 font-medium">${item.name}</td>
          <td class="py-2">${item.price.toFixed(2)}</td>
          <td class="py-2 text-sm text-slate-500">${item.sharedBy.join(', ')}</td>
          <td class="py-2 text-right">
            <button onclick="removeFoodItem(${i})" class="text-red-500 hover:text-red-700 text-sm">ลบ</button>
          </td>
        </tr>
      `).join('');
    }

    function calculateTotal() {
      if (people.length === 0) {
        document.getElementById('summaryList').innerHTML = '<div class="text-slate-400">ยังไม่มีข้อมูล</div>';
        document.getElementById('grandTotal').innerText = '0.00 บาท';
        return;
      }

      // 1. คำนวณยอดดิบของแต่ละคน
      let rawTotals = {};
      people.forEach(p => rawTotals[p] = 0);

      let subtotal = 0;
      foodItems.forEach(item => {
        subtotal += item.price;
        const sharePrice = item.price / item.sharedBy.length;
        item.sharedBy.forEach(person => {
          if (rawTotals[person] !== undefined) {
            rawTotals[person] += sharePrice;
          }
        });
      });

      // 2. คำนวณส่วนลด, Service Charge และ VAT
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const enableSC = document.getElementById('enableServiceCharge').checked;
      const enableVat = document.getElementById('enableVat').checked;

      // ตัวคูณสำหรับการกระจายค่าใช้จ่ายเสริมตามสัดส่วนที่กินจริง
      let multiplier = 1;
      if (subtotal > 0) {
        let currentTotal = subtotal - discount;
        if (enableSC) currentTotal *= 1.10; // + Service Charge 10%
        if (enableVat) currentTotal *= 1.07; // + VAT 7%
        multiplier = currentTotal / subtotal;
      }

      // 3. คำนวณยอดสุทธิของแต่ละคน
      let grandTotal = 0;
      const summaryContainer = document.getElementById('summaryList');
      summaryContainer.innerHTML = '';

      people.forEach(p => {
        const finalAmount = Math.max(0, rawTotals[p] * multiplier);
        grandTotal += finalAmount;

        summaryContainer.innerHTML += `
          <div class="flex justify-between py-2 text-sm md:text-base">
            <span>${p}</span>
            <span class="font-mono font-bold text-emerald-400">${finalAmount.toFixed(2)} บาท</span>
          </div>
        `;
      });

      document.getElementById('grandTotal').innerText = `${grandTotal.toFixed(2)} บาท`;
    }
  </script>
</body>
</html>
