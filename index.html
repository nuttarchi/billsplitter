<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpme Split</title>
    <!-- Library สำหรับโหลดบิลเป็นรูปภาพ JPG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f5f5f7; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            color: #1d1d1f; 
        }
        h1 { 
            text-align: center; 
            margin-bottom: 5px; 
            font-size: 32px; 
            font-weight: 800;
            letter-spacing: -1px;
        }
        p.subtitle { 
            text-align: center; 
            color: #86868b; 
            font-size: 13px; 
            letter-spacing: 1px; 
            margin-bottom: 30px; 
            font-weight: 600;
        }
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
        }
        h2 { 
            font-size: 18px; 
            margin-top: 0; 
            margin-bottom: 20px;
            display: flex; 
            align-items: center; 
            font-weight: 700;
        }
        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            margin-right: 12px; 
            display: inline-block;
        }
        .dot.yellow { background-color: #ffcc00; }
        .dot.red { background-color: #ff3b30; }
        .dot.black { background-color: #1d1d1f; }
        .dot.green { background-color: #34c759; }
        
        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #e5e5ea; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fafafa;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button.add-btn { 
            background-color: #ffcc00; 
            color: #1d1d1f; 
            width: auto; 
            padding: 14px 24px; 
        }
        button.red-btn { background-color: #ff3b30; color: white; }
        button.download-btn { 
            background-color: #ffcc00; 
            color: #1d1d1f; 
            margin-top: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row input { flex: 1; margin-bottom: 0; }
        
        .checkbox-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            margin-bottom: 20px; 
            padding: 15px;
            background-color: #fafafa;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
        }
        .checkbox-label { 
            display: flex; 
            align-items: center; 
            background: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 14px; 
            cursor: pointer; 
            border: 1px solid #e5e5ea;
        }
        .checkbox-label input { display: none; }
        
        /* Item Table Styles */
        .table-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 12px;
            color: #1d1d1f;
            letter-spacing: 0.5px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1d1d1f;
            margin-top: 20px;
        }
        .table-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .col-item { flex: 2; font-weight: 600; }
        .col-price { flex: 1; text-align: center; }
        .col-shared { flex: 2; color: #86868b; font-size: 12px; text-align: center; padding: 0 5px; }
        .col-action { flex: 1; text-align: right; }

        .delete-btn { 
            background: none; 
            color: #ff3b30; 
            padding: 0; 
            width: auto; 
            font-size: 13px; 
            font-weight: 600;
        }

        /* Checkbox list style */
        .charge-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
        .charge-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1d1d1f;
        }

        /* Summary Dark Card */
        .summary-card {
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            color: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .summary-card h2 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
            color: #e5e5ea;
        }
        .grand-total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .grand-total-label {
            font-size: 14px;
            letter-spacing: 1px;
            color: #86868b;
            font-weight: 700;
        }
        .grand-total-val {
            font-size: 32px;
            font-weight: 800;
            color: white;
        }

        /* Pay Here Section inside Summary */
        .pay-here-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #444;
            text-align: center;
        }
        .pay-here-box h3 {
            color: #34c759;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .bank-info {
            background: #222;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 14px;
            color: #ccc;
        }
        .bank-info p { margin: 5px 0; display: flex; justify-content: space-between; }
        .bank-info span { color: white; font-weight: bold; }

        .btn-upload {
            background-color: #fafafa;
            color: #007aff;
            border: 1px dashed #007aff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
        }
        .file-upload-wrapper { position: relative; overflow: hidden; }
        .file-upload-wrapper input[type=file] {
            position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%;
        }
    </style>
</head>
<body>

    <h1>Helpme Split</h1>
    <p class="subtitle">💗 NO MORE TABLE MATH 💗</p>

    <!-- 1. Add People -->
    <div class="card">
        <h2><span class="dot yellow"></span> Add People</h2>
        <div class="flex-row">
            <input type="text" id="personName" placeholder="Enter name...">
            <button class="add-btn" onclick="addPerson()">Add</button>
        </div>
        <div id="peopleList" style="margin-top: 15px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
    </div>

    <!-- 2. Add Food Items -->
    <div class="card">
        <h2><span class="dot red"></span> Add Food Items</h2>
        <input type="text" id="itemName" placeholder="Item name">
        <input type="number" id="itemPrice" placeholder="Price (฿)">
        
        <div style="margin: 15px 0 10px 0; font-weight: 600; font-size: 14px;">Who shared this item?</div>
        <div id="sharedBy" class="checkbox-group">
            <span style="color:#86868b; font-size:14px; font-style: italic;">Please add people first</span>
        </div>
        <button class="red-btn" onclick="addItem()">Add Item</button>

        <!-- Item Table -->
        <div class="table-header">
            <span class="col-item">ITEM</span>
            <span class="col-price">PRICE</span>
            <span class="col-shared">SHARED BY</span>
            <span class="col-action">ACTION</span>
        </div>
        <div id="itemList"></div>
    </div>

    <!-- 3. Additional Charges -->
    <div class="card">
        <h2><span class="dot black"></span> Additional Charges</h2>
        
        <label class="charge-option">
            <input type="checkbox" id="scCheckbox" onchange="calculate()"> Service Charge 10%
        </label>
        
        <label class="charge-option">
            <input type="checkbox" id="vatCheckbox" onchange="calculate()"> VAT 7%
        </label>

        <div style="margin-top: 15px;">
            <label style="font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">Discount Amount</label>
            <input type="number" id="discountInput" value="0" oninput="calculate()">
        </div>
    </div>

    <!-- 4. Payment Info (Optional) -->
    <div class="card">
        <h2><span class="dot green"></span> Payment Info <span style="font-size: 12px; color: #86868b; margin-left: 5px; font-weight: normal;">(Optional)</span></h2>
        
        <div class="file-upload-wrapper">
            <div class="btn-upload" id="uploadLabel">📷 Upload QR Code (PromptPay)</div>
            <input type="file" id="qrUpload" accept="image/*" onchange="previewQR(event)">
        </div>
        <img id="qrPreviewImage" style="max-width: 120px; display:none; margin: 10px auto; border-radius: 8px;">

        <input type="text" id="bankName" placeholder="Bank Name (e.g. KBank)" oninput="calculate()">
        <input type="text" id="accNumber" placeholder="Account Number" oninput="calculate()">
        <input type="text" id="accName" placeholder="Account Name" oninput="calculate()">
    </div>

    <!-- 5. Summary Dark Card -->
    <div class="summary-card" id="billSummaryCard">
        <h2>Summary</h2>
        <div id="summaryContent" style="color: #86868b; font-size: 14px;">No data yet</div>

        <div class="grand-total-box">
            <span class="grand-total-label">GRAND TOTAL</span>
            <span class="grand-total-val" id="grandTotalVal">0.00</span>
        </div>

        <!-- Pay Here Area -->
        <div id="payHereArea" style="display: none;" class="pay-here-box">
            <h3>☘️ Pay here ☘️</h3>
            <img id="summaryQrImg" style="max-width: 180px; width:100%; border-radius: 12px; display: none; margin: 0 auto 15px auto;">
            <div id="summaryBankInfo" class="bank-info" style="display: none;"></div>
        </div>
    </div>

    <button class="download-btn" onclick="downloadBillImage()">
        📥 Generate Bill (JPG)
    </button>

    <script>
        let people = [];
        let items = [];
        let qrDataUrl = '';

        function addPerson() {
            const input = document.getElementById('personName');
            const name = input.value.trim();
            if (name && !people.includes(name)) {
                people.push(name);
                input.value = '';
                renderPeople();
                renderCheckboxes();
                calculate();
            }
        }

        function removePerson(index) {
            people.splice(index, 1);
            renderPeople();
            renderCheckboxes();
            calculate();
        }

        function renderPeople() {
            const list = document.getElementById('peopleList');
            list.innerHTML = '';
            people.forEach((p, i) => {
                list.innerHTML += `<span style="background:#f5f5f7; border: 1px solid #e5e5ea; padding: 6px 12px; border-radius: 20px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;">
                    ${p} <b onclick="removePerson(${i})" style="color:#ff3b30; cursor:pointer;">×</b>
                </span>`;
            });
        }

        function renderCheckboxes() {
            const group = document.getElementById('sharedBy');
            if (people.length === 0) {
                group.innerHTML = '<span style="color:#86868b; font-size:14px; font-style: italic;">Please add people first</span>';
                return;
            }
            group.innerHTML = '';
            people.forEach(p => {
                group.innerHTML += `<label class="checkbox-label"><input type="checkbox" value="${p}" class="person-cb"> ${p}</label>`;
            });

            document.querySelectorAll('.person-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    this.parentElement.style.background = this.checked ? '#ffcc00' : 'white';
                    this.parentElement.style.borderColor = this.checked ? '#ffcc00' : '#e5e5ea';
                    this.parentElement.style.fontWeight = this.checked ? 'bold' : 'normal';
                });
            });
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const selected = Array.from(document.querySelectorAll('.person-cb:checked')).map(cb => cb.value);

            if (!name || isNaN(price) || price <= 0 || selected.length === 0) {
                alert('Please enter valid item name, price, and select at least one person.');
                return;
            }

            items.push({ name, price, sharedBy: selected });
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.querySelectorAll('.person-cb').forEach(cb => {
                cb.checked = false;
                cb.parentElement.style.background = 'white';
                cb.parentElement.style.borderColor = '#e5e5ea';
                cb.parentElement.style.fontWeight = 'normal';
            });

            renderItems();
            calculate();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
            calculate();
        }

        function renderItems() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            items.forEach((item, i) => {
                list.innerHTML += `<div class="table-row">
                    <span class="col-item">${item.name}</span>
                    <span class="col-price">฿${item.price}</span>
                    <span class="col-shared">${item.sharedBy.join(', ')}</span>
                    <span class="col-action"><button class="delete-btn" onclick="removeItem(${i})">Remove</button></span>
                </div>`;
            });
        }

        function previewQR(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    qrDataUrl = e.target.result;
                    document.getElementById('uploadLabel').textContent = '✅ QR Code Uploaded';
                    calculate();
                }
                reader.readAsDataURL(file);
            }
        }

        function calculate() {
            if (items.length === 0 || people.length === 0) {
                document.getElementById('summaryContent').innerHTML = 'No data yet';
                document.getElementById('grandTotalVal').textContent = '0.00';
                document.getElementById('payHereArea').style.display = 'none';
                return;
            }

            let subtotal = 0;
            let personSubtotals = {};
            people.forEach(p => personSubtotals[p] = 0);

            items.forEach(item => {
                subtotal += item.price;
                const splitPrice = item.price / item.sharedBy.length;
                item.sharedBy.forEach(p => {
                    if (personSubtotals[p] !== undefined) {
                        personSubtotals[p] += splitPrice;
                    }
                });
            });

            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            let currentTotal = Math.max(0, subtotal - discount);

            const hasSC = document.getElementById('scCheckbox').checked;
            const scAmount = hasSC ? currentTotal * 0.10 : 0;
            currentTotal += scAmount;

            const hasVAT = document.getElementById('vatCheckbox').checked;
            const vatAmount = hasVAT ? currentTotal * 0.07 : 0;
            const grandTotal = currentTotal + vatAmount;

            // Ratio for additional charges
            const multiplier = subtotal > 0 ? (grandTotal / subtotal) : 0;

            let html = '';
            people.forEach(p => {
                const finalPersonTotal = personSubtotals[p] * multiplier;
                if (finalPersonTotal > 0) {
                    html += `<div class="summary-item"><span>${p}</span> <strong>฿${finalPersonTotal.toFixed(2)}</strong></div>`;
                }
            });

            document.getElementById('summaryContent').innerHTML = html;
            document.getElementById('grandTotalVal').textContent = grandTotal.toFixed(2);

            // Payment Details Render
            const bank = document.getElementById('bankName').value.trim();
            const accNum = document.getElementById('accNumber').value.trim();
            const accName = document.getElementById('accName').value.trim();

            const payHereArea = document.getElementById('payHereArea');
            const summaryQrImg = document.getElementById('summaryQrImg');
            const summaryBankInfo = document.getElementById('summaryBankInfo');

            if (qrDataUrl || bank || accNum || accName) {
                payHereArea.style.display = 'block';

                if (qrDataUrl) {
                    summaryQrImg.src = qrDataUrl;
                    summaryQrImg.style.display = 'block';
                } else {
                    summaryQrImg.style.display = 'none';
                }

                if (bank || accNum || accName) {
                    let bankHtml = '';
                    if (bank) bankHtml += `<p>Bank: <span>${bank}</span></p>`;
                    if (accNum) bankHtml += `<p>Account No: <span>${accNum}</span></p>`;
                    if (accName) bankHtml += `<p>Name: <span>${accName}</span></p>`;
                    summaryBankInfo.innerHTML = bankHtml;
                    summaryBankInfo.style.display = 'block';
                } else {
                    summaryBankInfo.style.display = 'none';
                }
            } else {
                payHereArea.style.display = 'none';
            }
        }

        function downloadBillImage() {
            const summaryCard = document.getElementById('billSummaryCard');
            html2canvas(summaryCard, { backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Helpme-Split-Bill.jpg';
                link.href = canvas.toDataURL('image/jpeg');
                link.click();
            });
        }
    </script>
</body>
</html>
