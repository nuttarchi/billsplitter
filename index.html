<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpme Split</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f5f5f7; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            color: #1d1d1f; 
        }
        h1 { 
            text-align: center; 
            margin-bottom: 5px; 
            font-size: 32px; 
            font-weight: 800;
            letter-spacing: -1px;
        }
        p.subtitle { 
            text-align: center; 
            color: #86868b; 
            font-size: 13px; 
            letter-spacing: 1px; 
            margin-bottom: 30px; 
            font-weight: 600;
        }
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
        }
        h2 { 
            font-size: 18px; 
            margin-top: 0; 
            margin-bottom: 20px;
            display: flex; 
            align-items: center; 
        }
        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            margin-right: 12px; 
        }
        .dot.yellow { background-color: #ffcc00; }
        .dot.red { background-color: #ff3b30; }
        .dot.green { background-color: #34c759; }
        
        input[type="text"], input[type="number"], input[type="file"] { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #e5e5ea; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fafafa;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #007aff;
            background-color: #fff;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            color: white; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button.add-btn { 
            background-color: #ffcc00; 
            color: #1d1d1f; 
            width: auto; 
            padding: 14px 24px; 
        }
        button.red-btn { background-color: #ff3b30; }
        button.calc-btn { background-color: #1d1d1f; margin-bottom: 40px; }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row input { flex: 1; margin-bottom: 0; }
        
        .checkbox-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            margin-bottom: 20px; 
            padding: 15px;
            background-color: #fafafa;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
        }
        .checkbox-label { 
            display: flex; 
            align-items: center; 
            background: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 14px; 
            cursor: pointer; 
            border: 1px solid #e5e5ea;
            transition: all 0.2s;
        }
        .checkbox-label:has(input:checked) {
            background: #ffcc00;
            border-color: #ffcc00;
            font-weight: bold;
        }
        .checkbox-label input { margin-right: 8px; display: none; }
        
        #summary { margin-top: 20px; margin-bottom: 40px; }
        .bill-result { 
            background: white; 
            padding: 30px 24px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
        }
        /* Receipt zig-zag effect */
        .bill-result::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 0;
            right: 0;
            height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 0, transparent 10px, white 11px);
        }
        .bill-result h2 { justify-content: center; font-size: 24px; margin-bottom: 30px;}
        
        .person-total { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 15px; 
            border-bottom: 1px dashed #e5e5ea; 
            padding-bottom: 10px; 
            font-size: 17px;
        }
        .grand-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 22px;
            font-weight: 800;
            color: #ff3b30;
            padding-top: 15px;
            border-top: 2px solid #1d1d1f;
        }
        
        .qr-preview { 
            max-width: 150px; 
            max-height: 150px; 
            display: block; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: 1px solid #e5e5ea;
        }
        
        .pay-here { 
            text-align: center; 
            margin-top: 30px; 
            padding-top: 25px; 
            border-top: 2px dashed #e5e5ea; 
        }
        .pay-here h3 { 
            color: #34c759; 
            margin-bottom: 20px; 
            font-size: 20px;
        }
        .bank-details { 
            text-align: left; 
            background: #f5f5f7; 
            padding: 20px; 
            border-radius: 16px; 
            display: inline-block; 
            width: 100%; 
            box-sizing: border-box;
        }
        .bank-details p { 
            margin: 8px 0; 
            font-size: 15px; 
            display: flex;
            justify-content: space-between;
        }
        .bank-details p span { font-weight: bold; color: #1d1d1f; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            padding: 12px 0; 
            border-bottom: 1px solid #f0f0f0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        li:last-child { border-bottom: none; }
        .delete-btn { 
            background: #f5f5f7; 
            color: #ff3b30; 
            padding: 8px 12px; 
            border-radius: 8px;
            width: auto; 
            font-size: 13px; 
        }
        
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn-upload {
            background-color: #f5f5f7;
            color: #007aff;
            border: 1px dashed #007aff;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Helpme Split</h1>
    <p class="subtitle">💗 NO MORE TABLE MATH 💗</p>

    <!-- People Section -->
    <div class="card">
        <h2><span class="dot yellow"></span> Add People</h2>
        <div class="flex-row">
            <input type="text" id="personName" placeholder="Enter name...">
            <button class="add-btn" onclick="addPerson()">Add</button>
        </div>
        <ul id="peopleList" style="margin-top: 15px;"></ul>
    </div>

    <!-- Items Section -->
    <div class="card">
        <h2><span class="dot red"></span> Add Food Items</h2>
        <input type="text" id="itemName" placeholder="Item name">
        <input type="number" id="itemPrice" placeholder="Price (฿)">
        <div style="margin: 20px 0 10px 0; font-weight: 600; font-size: 15px;">Who shared this item?</div>
        <div id="sharedBy" class="checkbox-group">
            <span style="color:#86868b; font-size:14px; font-style: italic;">Please add people first</span>
        </div>
        <button class="red-btn" onclick="addItem()">Add Item</button>
        <ul id="itemList" style="margin-top: 15px;"></ul>
    </div>

    <!-- Payment Details Section -->
    <div class="card">
        <h2><span class="dot green"></span> Payment Info <span style="font-size: 12px; color: #86868b; margin-left: 8px; font-weight: normal;">(Optional)</span></h2>
        
        <div class="file-upload-wrapper">
            <div class="btn-upload">📷 Upload QR Code (PromptPay)</div>
            <input type="file" id="qrUpload" accept="image/*" onchange="previewQR(event)">
        </div>
        <img id="qrPreviewImage" class="qr-preview" style="display:none;">
        
        <div style="margin: 20px 0 10px 0; font-weight: 600; font-size: 15px;">Or Bank Details</div>
        <input type="text" id="bankName" placeholder="Bank Name (e.g. KBank, SCB)">
        <input type="text" id="accNumber" placeholder="Account Number">
        <input type="text" id="accName" placeholder="Account Name">
    </div>

    <button class="calc-btn" onclick="generateBill()">Generate Bill</button>

    <div id="summary"></div>

    <script>
        let people = [];
        let items = [];
        let qrDataUrl = '';

        function addPerson() {
            const nameInput = document.getElementById('personName');
            const name = nameInput.value.trim();
            if (name && !people.includes(name)) {
                people.push(name);
                nameInput.value = '';
                updatePeopleList();
                updateCheckboxGroup();
            }
        }

        function removePerson(index) {
            people.splice(index, 1);
            updatePeopleList();
            updateCheckboxGroup();
        }

        function updatePeopleList() {
            const list = document.getElementById('peopleList');
            list.innerHTML = '';
            people.forEach((p, i) => {
                list.innerHTML += `<li><span>${p}</span> <button class="delete-btn" onclick="removePerson(${i})">Remove</button></li>`;
            });
        }

        function updateCheckboxGroup() {
            const group = document.getElementById('sharedBy');
            if (people.length === 0) {
                group.innerHTML = '<span style="color:#86868b; font-size:14px; font-style: italic;">Please add people first</span>';
                return;
            }
            group.innerHTML = '';
            people.forEach(p => {
                group.innerHTML += `<label class="checkbox-label"><input type="checkbox" value="${p}" class="person-cb"> ${p}</label>`;
            });
            
            // Add event listeners to toggle visual state of custom checkboxes
            document.querySelectorAll('.person-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    if(this.checked) {
                        this.parentElement.style.background = '#ffcc00';
                        this.parentElement.style.borderColor = '#ffcc00';
                        this.parentElement.style.fontWeight = 'bold';
                    } else {
                        this.parentElement.style.background = 'white';
                        this.parentElement.style.borderColor = '#e5e5ea';
                        this.parentElement.style.fontWeight = 'normal';
                    }
                });
            });
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const checkboxes = document.querySelectorAll('.person-cb:checked');
            
            if (!name || isNaN(price) || price <= 0) {
                alert('Please enter a valid item name and price.');
                return;
            }
            if (checkboxes.length === 0) {
                alert('Please select at least one person who shared this item.');
                return;
            }

            const sharedBy = Array.from(checkboxes).map(cb => cb.value);
            items.push({ name, price, sharedBy });
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            
            // Reset checkboxes visually and logically
            document.querySelectorAll('.person-cb').forEach(cb => {
                cb.checked = false;
                cb.parentElement.style.background = 'white';
                cb.parentElement.style.borderColor = '#e5e5ea';
                cb.parentElement.style.fontWeight = 'normal';
            });
            
            updateItemList();
        }

        function removeItem(index) {
            items.splice(index, 1);
            updateItemList();
        }

        function updateItemList() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            items.forEach((item, i) => {
                list.innerHTML += `<li>
                    <div>
                        <strong style="font-size: 16px;">${item.name}</strong> 
                        <span style="color: #ff3b30; font-weight: 600; margin-left: 5px;">฿${item.price}</span> 
                        <br><small style="color:#86868b; display:inline-block; margin-top:4px;">Shared by: ${item.sharedBy.join(', ')}</small>
                    </div>
                    <button class="delete-btn" onclick="removeItem(${i})">Remove</button>
                </li>`;
            });
        }

        function previewQR(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    qrDataUrl = e.target.result;
                    const img = document.getElementById('qrPreviewImage');
                    img.src = qrDataUrl;
                    img.style.display = 'block';
                    
                    // Update button text
                    document.querySelector('.btn-upload').textContent = '✅ QR Code Uploaded (Click to change)';
                }
                reader.readAsDataURL(file);
            }
        }

        function generateBill() {
            if (people.length === 0 || items.length === 0) {
                alert('Please add people and items first.');
                return;
            }

            let totals = {};
            people.forEach(p => totals[p] = 0);

            items.forEach(item => {
                const splitAmount = item.price / item.sharedBy.length;
                item.sharedBy.forEach(p => {
                    if (totals[p] !== undefined) {
                        totals[p] += splitAmount;
                    }
                });
            });

            let grandTotal = 0;
            let html = '<div class="bill-result"><h2>🧾 Bill Summary</h2>';
            
            for (const person in totals) {
                const amt = totals[person];
                if (amt > 0) {
                    html += `<div class="person-total"><span>${person}</span> <strong>฿${amt.toFixed(2)}</strong></div>`;
                    grandTotal += amt;
                }
            }
            
            html += `<div class="grand-total"><span>Total</span> <span>฿${grandTotal.toFixed(2)}</span></div>`;

            // Add Payment Section
            const bankName = document.getElementById('bankName').value.trim();
            const accNum = document.getElementById('accNumber').value.trim();
            const accName = document.getElementById('accName').value.trim();

            if (qrDataUrl || bankName || accNum || accName) {
                html += `<div class="pay-here">
                    <h3>☘️ Pay here ☘️</h3>`;
                
                if (qrDataUrl) {
                    html += `<img src="${qrDataUrl}" alt="QR Code" style="max-width: 220px; width: 100%; border-radius: 16px; display: block; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e5e5ea;">`;
                }

                if (bankName || accNum || accName) {
                    html += `<div class="bank-details">`;
                    if (bankName) html += `<p>Bank: <span>${bankName}</span></p>`;
                    if (accNum) html += `<p>Account No: <span>${accNum}</span></p>`;
                    if (accName) html += `<p>Name: <span>${accName}</span></p>`;
                    html += `</div>`;
                }
                html += `</div>`;
            }

            html += '</div>';
            document.getElementById('summary').innerHTML = html;
            
            // Scroll to summary
            setTimeout(() => {
                document.getElementById('summary').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    </script>
</body>
</html>
